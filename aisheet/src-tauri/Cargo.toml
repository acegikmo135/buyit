[package]
name = "aisheet"
version = "0.1.0"
description = "AI-native spreadsheet for Windows"
edition = "2021"
rust-version = "1.77"

[lib]
name = "aisheet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
whisper-rs = "0.16"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "time", "rt"] }

# API keys live in the OS credential store (Windows Credential Manager on Windows).
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# keep the C++ inference core fully optimised even though the rest of the app is size-optimised
[profile.release.package.whisper-rs-sys]
opt-level = 3
[profile.release.package.whisper-rs]
opt-level = 3
