name: AiSheet Windows build
on:
  push:
    paths: ['aisheet/**', '.github/workflows/aisheet-windows.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults: { run: { working-directory: aisheet } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: aisheet/go.mod, cache-dependency-path: aisheet/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: aisheet/frontend/package-lock.json }
      - name: Frontend tests
        working-directory: aisheet/frontend
        run: |
          npm ci
          npm test
      - name: Go vet
        run: |
          New-Item -ItemType Directory -Force frontend/dist | Out-Null
          if (-not (Test-Path frontend/dist/.keep)) { New-Item frontend/dist/.keep -ItemType File | Out-Null }
          go vet ./...
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - name: Build AiSheet.exe
        run: wails build -platform windows/amd64 -clean -ldflags "-s -w" -trimpath
      - name: Download WebView2 bootstrapper and build the installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile installer/MicrosoftEdgeWebview2Setup.exe
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=0.3.${{ github.run_number }}" installer/aisheet.iss
          Copy-Item build/bin/AiSheet.exe dist-out/AiSheet.exe
          Get-ChildItem dist-out | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with: { name: AiSheet-windows, path: aisheet/dist-out/*.exe }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: aisheet-latest
          name: AiSheet (latest Windows build)
          body: "AiSheet-Setup.exe = installer (Start Menu + desktop shortcut + right-click 'Open with AiSheet'). AiSheet.exe = portable app, no install."
          files: aisheet/dist-out/*.exe
          target_commitish: ${{ github.sha }}
