name: AiSheet Windows build
on:
  push:
    paths: ['aisheet/**', '.github/workflows/aisheet-windows.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults: { run: { working-directory: aisheet } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: 'aisheet/src-tauri -> target' }
      - name: Check LLVM/CMake (needed to compile whisper.cpp)
        shell: pwsh
        run: |
          clang --version
          cmake --version
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: npm ci
      - run: npm test
      - run: npx tauri build
      - name: Collect the two deliverables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ../dist-out | Out-Null
          Copy-Item src-tauri/target/release/aisheet.exe ../dist-out/AiSheet.exe
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $setup.FullName ../dist-out/AiSheet-Setup.exe
      - uses: actions/upload-artifact@v4
        with: { name: AiSheet-windows, path: dist-out/*.exe }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: aisheet-latest
          name: AiSheet (latest Windows build)
          body: "AiSheet.exe = portable app (no install). AiSheet-Setup.exe = installer with Start Menu + Desktop shortcuts."
          files: dist-out/*.exe
          target_commitish: ${{ github.sha }}
